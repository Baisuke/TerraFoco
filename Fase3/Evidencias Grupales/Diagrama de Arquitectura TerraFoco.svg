<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="900" viewBox="0 0 2000 900">
  <!-- Diagrama de arquitectura de TerraFoco en su versión de título (Fase 3),
       según el código actual. Mismo esquema que el de la Fase 1: cinco capas
       de izquierda a derecha. Para exportarlo a PNG, abrir este archivo en el
       navegador y capturarlo. -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=block');
      text { font-family: Inter, 'Segoe UI', Arial, sans-serif; fill: #3f3f46; font-size: 14px; }
      .tab { fill: #18181b; }
      .tab-t { fill: #ffffff; font-size: 22px; }
      .panel { fill: none; stroke: #52525b; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #52525b; stroke-width: 1.3; }
      .t { fill: #18181b; font-size: 16px; font-weight: 600; text-anchor: middle; }
      .d { text-anchor: middle; }
      .s { font-size: 13px; }
      .li { fill: #18181b; font-size: 14px; }
      .lbl { font-size: 12px; fill: #52525b; }
      .nota { font-size: 13px; fill: #71717a; font-style: italic; text-anchor: middle; }
      .w { fill: none; stroke: #3f3f46; stroke-width: 1.8; }
      .a { fill: none; stroke: #3f3f46; stroke-width: 1.8; marker-end: url(#flecha); }
      .dash { stroke-dasharray: 6 5; }
    </style>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/>
    </marker>
  </defs>

  <rect width="2000" height="900" fill="#ffffff"/>

  <!-- ===================== Paneles y pestañas ===================== -->
  <rect class="panel" x="16" y="62" width="360" height="822" rx="14"/>
  <rect class="panel" x="410" y="62" width="360" height="822" rx="14"/>
  <rect class="panel" x="812" y="62" width="360" height="822" rx="14"/>
  <rect class="panel" x="1214" y="62" width="360" height="822" rx="14"/>
  <rect class="panel" x="1624" y="62" width="360" height="822" rx="14"/>

  <rect class="tab" x="16" y="16" width="200" height="40" rx="3"/>
  <text class="tab-t" x="26" y="44">Fuentes externas</text>
  <rect class="tab" x="410" y="16" width="92" height="40" rx="3"/>
  <text class="tab-t" x="420" y="44">Núcleo</text>
  <rect class="tab" x="812" y="16" width="216" height="40" rx="3"/>
  <text class="tab-t" x="822" y="44">Módulos analíticos</text>
  <rect class="tab" x="1214" y="16" width="114" height="40" rx="3"/>
  <text class="tab-t" x="1224" y="44">Servicios</text>
  <rect class="tab" x="1624" y="16" width="154" height="40" rx="3"/>
  <text class="tab-t" x="1634" y="44">Presentación</text>

  <!-- ===================== Fuentes externas ===================== -->
  <rect class="box" x="48" y="76" width="250" height="88"/>
  <text class="t" x="173" y="107">NASA Earthdata</text>
  <text class="d" x="173" y="127">NASADEM (relieve) y</text>
  <text class="d" x="173" y="145">ECOSTRESS (temperatura)</text>

  <rect class="box" x="48" y="177" width="250" height="88"/>
  <text class="t" x="173" y="208">Copernicus Sentinel-2</text>
  <text class="d" x="173" y="228">NDVI vía Sentinel Hub</text>
  <text class="d" x="173" y="246">(Process API)</text>

  <rect class="box" x="48" y="278" width="250" height="88"/>
  <text class="t" x="173" y="309">CIREN</text>
  <text class="d" x="173" y="329">Inventario Nacional de</text>
  <text class="d" x="173" y="347">Erosión (WFS)</text>

  <rect class="box" x="48" y="379" width="250" height="88"/>
  <text class="t" x="173" y="410">IDE Chile e IDE Minagri</text>
  <text class="d" x="173" y="430">comunas, red hídrica y</text>
  <text class="d" x="173" y="448">SIRSD-S por predio</text>

  <rect class="box" x="48" y="480" width="250" height="88"/>
  <text class="t" x="173" y="511">CR2MET y SoilGrids</text>
  <text class="d" x="173" y="531">lluvia (factor R) y</text>
  <text class="d" x="173" y="549">suelos (factor K)</text>

  <rect class="box" x="48" y="581" width="250" height="88"/>
  <text class="t" x="173" y="612">INE, OSM y ESA WorldCover</text>
  <text class="d" x="173" y="632">Censo 2024, equipamiento,</text>
  <text class="d" x="173" y="650">áreas verdes y cultivos</text>

  <rect class="box" x="48" y="682" width="250" height="88"/>
  <text class="t" x="173" y="713">DesInventar (UNDRR)</text>
  <text class="d" x="173" y="733">eventos de inundación</text>
  <text class="d" x="173" y="751">(para validar)</text>

  <rect class="box" x="48" y="783" width="250" height="88"/>
  <text class="t" x="173" y="814">INDAP, SAG y ODEPA</text>
  <text class="d" x="173" y="834">serie SIRSD-S 2012-2025</text>
  <text class="d" x="173" y="852">y transparencia activa</text>

  <!-- Fuentes 1 a 7 a la ingesta; la 8 al ETL administrativo -->
  <path class="w" d="M298,120 H388 M298,221 H388 M298,322 H388 M298,423 H388 M298,524 H388 M298,625 H388 M298,726 H388 M388,120 V726"/>
  <path class="a" d="M388,237 H470"/>
  <path class="a" d="M298,827 H440 V746 H470"/>

  <!-- ===================== Núcleo ===================== -->
  <rect class="box" x="470" y="72" width="240" height="100"/>
  <text class="t" x="590" y="100">PROGRAMADOR</text>
  <text class="d" x="590" y="120">(Python, cadencia por fuente)</text>
  <text class="d" x="590" y="138">dispara ingesta, ETL,</text>
  <text class="d" x="590" y="156">cálculos y teselas</text>

  <rect class="box" x="470" y="200" width="240" height="74"/>
  <text class="t" x="590" y="233">INGESTA</text>
  <text class="d" x="590" y="253">(Python, requests, earthaccess)</text>

  <rect class="box" x="470" y="306" width="240" height="92"/>
  <text class="t" x="590" y="339">NORMALIZACIÓN</text>
  <text class="d" x="590" y="359">(GDAL, Rasterio)</text>
  <text class="d" x="590" y="377">UTM 19S, recorte, por comuna</text>

  <rect class="box" x="470" y="432" width="240" height="130"/>
  <!-- Ícono de base de datos -->
  <rect x="486" y="470" width="40" height="50" fill="#336791"/>
  <ellipse cx="506" cy="520" rx="20" ry="7" fill="#336791"/>
  <ellipse cx="506" cy="470" rx="20" ry="7" fill="#5b8fc0"/>
  <path d="M486,487 A20,7 0 0 0 526,487 M486,503 A20,7 0 0 0 526,503" fill="none" stroke="#5b8fc0" stroke-width="1.5"/>
  <text class="t" x="620" y="470">PostgreSQL 16</text>
  <text class="t" x="620" y="490">+ PostGIS 3.4</text>
  <text class="d s" x="620" y="514">territorio · indicadores</text>
  <text class="d s" x="620" y="531">programas · operación</text>

  <rect class="box" x="470" y="700" width="240" height="92"/>
  <text class="t" x="590" y="733">ETL ADMINISTRATIVO</text>
  <text class="d" x="590" y="753">(Python, pandas, openpyxl)</text>
  <text class="d" x="590" y="771">serie SIRSD-S y transparencia</text>

  <path class="a dash" d="M590,172 V200"/>
  <text class="lbl" x="600" y="190">dispara</text>
  <path class="a" d="M590,274 V306"/>
  <path class="a" d="M590,398 V432"/>
  <path class="a" d="M590,700 V562"/>

  <!-- La base alimenta los cinco módulos -->
  <path class="w" d="M710,497 H795 M795,136 V696"/>
  <path class="a" d="M795,136 H870"/>
  <path class="a" d="M795,276 H870"/>
  <path class="a" d="M795,416 H870"/>
  <path class="a" d="M795,556 H870"/>
  <path class="a" d="M795,696 H870"/>

  <!-- ===================== Módulos analíticos ===================== -->
  <rect class="box" x="870" y="84" width="260" height="104"/>
  <text class="t" x="1000" y="123">Módulo 1 - Erosión</text>
  <text class="d" x="1000" y="143">RUSLE e índice de pertinencia</text>
  <text class="d" x="1000" y="161">(Rasterio, GeoPandas, NumPy)</text>

  <rect class="box" x="870" y="224" width="260" height="104"/>
  <text class="t" x="1000" y="263">Módulo 2 - Inundaciones</text>
  <text class="d" x="1000" y="283">Susceptibilidad y exposición</text>
  <text class="d" x="1000" y="301">(pysheds, SciPy, NumPy)</text>

  <rect class="box" x="870" y="364" width="260" height="104"/>
  <text class="t" x="1000" y="403">Módulo 3 - Térmico urbano</text>
  <text class="d" x="1000" y="423">Calor superficial y áreas verdes</text>
  <text class="d" x="1000" y="441">(Rasterio, GeoPandas, NumPy)</text>

  <rect class="box" x="870" y="504" width="260" height="104"/>
  <text class="t" x="1000" y="543">Transversal - Validación</text>
  <text class="d" x="1000" y="563">Spearman contra CIREN</text>
  <text class="d" x="1000" y="581">y DesInventar (NumPy)</text>

  <rect class="box" x="870" y="644" width="260" height="104"/>
  <text class="t" x="1000" y="683">Mapas y teselas</text>
  <text class="d" x="1000" y="703">PNG por comuna y PMTiles</text>
  <text class="d" x="1000" y="721">(Rasterio, pmtiles)</text>

  <!-- Los resultados de los módulos llegan a la API -->
  <path class="w" d="M1130,276 H1190 M1130,416 H1190 M1130,556 H1190 M1190,556 V136"/>
  <path class="a" d="M1130,136 H1280"/>
  <path class="a" d="M1130,696 H1280"/>

  <!-- ===================== Servicios ===================== -->
  <rect class="box" x="1280" y="70" width="230" height="132"/>
  <rect x="1345" y="84" width="100" height="30" rx="15" fill="#0ea5e9"/>
  <text x="1395" y="104" text-anchor="middle" style="fill:#ffffff;font-weight:600;font-size:14px">API REST</text>
  <text class="t" x="1395" y="142">FastAPI + Uvicorn</text>
  <text class="d" x="1395" y="162">JSON y GeoJSON</text>
  <text class="d" x="1395" y="180">(psycopg 3)</text>

  <rect class="box" x="1280" y="300" width="230" height="140"/>
  <text class="t" x="1395" y="339">Servicio en línea</text>
  <text class="d" x="1395" y="359">Open-Meteo: pronóstico</text>
  <text class="d" x="1395" y="377">de lluvia por comuna</text>
  <text class="d" x="1395" y="395">(módulo de inundaciones)</text>
  <text class="d s" x="1395" y="413">consultado desde el navegador</text>

  <rect class="box" x="1280" y="644" width="230" height="104"/>
  <text class="t" x="1395" y="683">Teselas PMTiles</text>
  <text class="d" x="1395" y="703">un archivo por capa, sin</text>
  <text class="d" x="1395" y="721">servidor de mapas</text>

  <text class="nota" x="1394" y="832">En el servidor público, la API y el</text>
  <text class="nota" x="1394" y="850">visor van detrás de Caddy (HTTPS)</text>

  <!-- Servicios hacia el visor -->
  <path class="a" d="M1510,136 H1690"/>
  <text class="lbl" x="1542" y="127" text-anchor="middle" style="font-size:11px">fetch JSON</text>
  <path class="a" d="M1510,370 H1590 V162 H1690"/>
  <path class="a" d="M1510,696 H1610 V186 H1690"/>
  <text class="lbl" x="1542" y="674" text-anchor="middle" style="font-size:11px">por rangos</text>
  <text class="lbl" x="1542" y="688" text-anchor="middle" style="font-size:11px">HTTP</text>

  <!-- ===================== Presentación ===================== -->
  <rect class="box" x="1690" y="70" width="250" height="132"/>
  <text class="t" x="1815" y="114">Visor cartográfico</text>
  <text class="d" x="1815" y="134">HTML + JS sin framework</text>
  <text class="d" x="1815" y="152">MapLibre GL JS 5, PMTiles</text>
  <text class="d" x="1815" y="170">three.js (relieve 3D)</text>

  <rect class="box" x="1690" y="240" width="250" height="276"/>
  <text class="t" x="1815" y="268">Pantallas</text>
  <text class="li" x="1714" y="298">·  Inicio</text>
  <text class="li" x="1714" y="324">·  Visor cartográfico</text>
  <text class="li" x="1714" y="350">·  Ficha de comuna</text>
  <text class="li" x="1714" y="376">·  Pertinencia territorial</text>
  <text class="li" x="1714" y="402">·  Inundaciones</text>
  <text class="li" x="1714" y="428">·  Térmico y cobertura urbana</text>
  <text class="li" x="1714" y="454">·  Fuentes de datos (con clave)</text>
  <text class="li" x="1714" y="480">·  Ayuda y glosario</text>

  <rect class="box" x="1690" y="600" width="250" height="104"/>
  <text class="t" x="1815" y="639">Copia local y portable</text>
  <text class="d" x="1815" y="659">indicadores.js si la API</text>
  <text class="d" x="1815" y="677">no responde · TerraFoco.cmd</text>

  <path class="a" d="M1815,202 V240"/>
  <path class="a dash" d="M1815,600 V516"/>
  <text class="lbl" x="1825" y="562">respaldo sin API</text>
</svg>
