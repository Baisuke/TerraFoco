# Servidor del prototipo. Solo para desarrollo y demostracion.
#
# El prototipo se monta como volumen, asi que editar un archivo se refleja al
# recargar. Pero el navegador cachea el CSS y el JS, y entonces un cambio
# reciente no aparece: durante una demostracion eso se ve como si la funcion
# no existiera, y no hay ninguna senal de que la culpa es de la cache.
#
# Aqui se sirve siempre la version del disco. Es lo correcto para un entorno
# de desarrollo; en produccion habria que hacer lo contrario.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
