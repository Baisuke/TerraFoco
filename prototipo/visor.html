<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor cartográfico · TerraFoco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="js/tema.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="main">
    <div id="topbar"></div>

    <div class="content">
      <!-- Dos columnas: capas y mapa. La leyenda y la ficha de la comuna van
           SOBRE el mapa; como tercera columna le quitaban dos tercios del
           ancho, y la leyenda repetía la que el detalle ya muestra encima. -->
      <div class="grid grid--visor">

        <!-- Panel de capas. Acompaña al mapa en pantalla completa: el id lo
             identifica para moverlo dentro del mapa y devolverlo al salir. -->
        <div class="card" id="panel-filtros">
          <div class="card__title">Capas</div>
          <div id="capas"></div>
          <div class="sep"></div>
          <div class="card__title">Opacidad</div>
          <input type="range" class="range" min="20" max="100" value="100" id="opacidad">
        </div>

        <!-- Mapa, con su leyenda y la ficha de la comuna encima -->
        <div class="card card--flush">
          <div class="map map--alto" id="mapa" style="border-radius:0">
            <div class="map__overlay map__overlay--tl" id="capaActiva">Erosión estimada TerraFoco</div>
            <div class="map__overlay map__overlay--bl map__leyenda" id="leyenda"></div>
            <aside class="map__overlay map__ficha" id="ficha" hidden aria-live="polite"></aside>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="js/api-base.js"></script>
<script src="js/paleta.js"></script>
<script src="js/data.js"></script>
<script src="datos/indicadores.js"></script>
<script src="js/datos-api.js"></script>
<script src="js/shell.js"></script>
<script src="js/mapa.js"></script>
<script src="datos/comunas.js"></script>
<script src="js/mapa-real.js"></script>
<script src="datos/erosion/indice.js"></script>
<script src="js/zonas.js"></script>
<script src="js/detalle-comuna.js"></script>
<script src="js/graficos.js"></script>
<script src="js/modelo3d.js"></script>
<script>
/* Espera a la API antes de pintar. Si no responde, la promesa
   se resuelve igual con los datos de ejemplo. */
GT.hidratar().then(function () {

pintarShell('visor', 'Visor cartográfico', 'Exploración de capas sobre la región piloto',
            CONTROLES_REGION + SELECTOR_ORIGEN + CASILLA_DOMINIO + BOTON_EXPORTAR,
            "Explora el territorio capa por capa. Elige qué variable ver en el mapa y haz clic en una comuna para revisar su detalle.");

const contenedorMapa = document.getElementById('mapa');

let mapa = null;

/* Intenta cartografía real desde la API; si no hay backend, cae al esquema. */
GTMapaReal.crearConRespaldo(contenedorMapa, {
  capa: 'erosion26',
  alSeleccionar: mostrarFicha,
  alDeseleccionar: ocultarFicha,
  /* Detalle por celda de las tres capas que lo tienen; enciende la primera.
     Cuál se ve lo decide la capa elegida (DETALLE_POR_CAPA, más abajo). */
  detalle: ['erosion', 'ndvi', 'pendiente'],
  /* El conmutador de base vive sobre el mapa —es el único control que las
     cuatro pantallas comparten—, así que el deslizador se entera por aquí. */
  alCambiarBase: function (id, base) {
    document.getElementById('opacidad').value =
      Math.round(base.opacidadTema / 0.82 * 100);
  },
  panel: '#panel-filtros'
}).then(function (api) {
  mapa = api;
  /* Si alguien eligió otra capa mientras el mapa cargaba, la leyenda ya
     cambió pero el mapa no se había enterado: se le aplica ahora. */
  const elegida = document.querySelector('input[name="capa"]:checked');
  if (elegida && elegida.value !== 'erosion26' && api.cambiarCapa) {
    api.cambiarCapa(elegida.value);
    if (api.activarDetalle) api.activarDetalle(DETALLE_POR_CAPA[elegida.value] || false);
  }
});

/* Las funciones de abajo se llaman por interacción del usuario, siempre
   después de que el mapa terminó de construirse. */
function conMapa(accion) { if (mapa) accion(mapa); }

/* ---- Panel de capas ---- */
const grupos = {};
GT.capas.forEach(function (c) {
  (grupos[c.grupo] = grupos[c.grupo] || []).push(c);
});

document.getElementById('capas').innerHTML = Object.keys(grupos).map(function (g) {
  return '<div class="card__title" style="margin-top:10px">' + g + '</div>' +
    grupos[g].map(function (c) {
      const esBase = c.id === 'limites';
      return '<div class="layer">' +
               '<input type="' + (esBase ? 'checkbox' : 'radio') + '" ' +
                 (esBase ? 'id="capa-limites"' : 'name="capa" value="' + c.id + '"') +
                 (c.activa ? ' checked' : '') + '>' +
               '<label>' + c.nombre + '<div class="layer__meta">' + c.fuente + '</div></label>' +
             '</div>';
    }).join('');
}).join('');

const leyendas = {
  erosion26:   function () { return GTMapa.leyendaClases(); },
  erosion10:   function () { return GTMapa.leyendaClases(); },
  /* Por clases, las mismas del detalle a 30 m: el promedio comunal y la
     celda se leen con una sola leyenda. */
  ndvi:        function () { return GTMapa.leyendaCortes('ndvi'); },
  pendiente:   function () { return GTMapa.leyendaCortes('pendiente'); },
  inversion:   function () {
    return GT.unidadInversion().indexOf('UF') === 0
      ? GTMapa.leyendaCortes('inversion') + sinIndice()
      : GTMapa.leyendaRampa('agua', '0,5', '20', 'ha / 1.000 ha');
  },
  pertinencia: function () {
    return GTMapa.leyendaPertinencia() + sinIndice();
  }
};

/* Las comunas grises de las dos capas del programa: cuántas y por qué. */
function sinIndice() {
  const n = GT.comunas.filter(function (c) { return !GT.enIndice(c); }).length;
  return n ? GTMapa.filaSinDato(n + ' fuera del dominio de validez') : '';
}

function actualizarLeyenda(capa) {
  document.getElementById('leyenda').innerHTML = leyendas[capa]();
}
actualizarLeyenda('erosion26');

/* Qué detalle por celda corresponde a cada capa. Las que no están aquí
   —erosión CIREN (del inventario se guarda el agregado comunal),
   inversión, pertinencia— son comunales y lo apagan. Antes el detalle de erosión quedaba encendido con
   cualquier capa, y el mapa seguía pintando erosión bajo el título y la
   leyenda de, por ejemplo, el NDVI. */
const DETALLE_POR_CAPA = { erosion26: 'erosion', ndvi: 'ndvi', pendiente: 'pendiente' };

document.querySelectorAll('input[name="capa"]').forEach(function (r) {
  r.addEventListener('change', function () {
    conMapa(function (m) {
      m.cambiarCapa(r.value);
      if (m.activarDetalle) m.activarDetalle(DETALLE_POR_CAPA[r.value] || false);
    });
    actualizarLeyenda(r.value);
    // El modelo 3D es de la pendiente: al cambiar de capa se vuelve al mapa.
    if (r.value !== 'pendiente' && typeof GTModelo3D !== 'undefined') GTModelo3D.cerrar();
    const capa = GT.capas.find(function (c) { return c.id === r.value; });
    document.getElementById('capaActiva').textContent = capa.nombre;
  });
});

document.getElementById('capa-limites').addEventListener('change', function (e) {
  conMapa(function (m) { m.cambiarLimites(e.target.checked); });
});
/* Había una sección "Visualización" con otra casilla de límites —la misma
   de "Base"— y una de nombres de comuna que no hacía nada: los nombres los
   pone el mapa base. Una casilla que no responde enseña a desconfiar de las
   demás. */
document.getElementById('opacidad').addEventListener('input', function (e) {
  const v = e.target.value / 100;
  conMapa(function (m) {
    if (m.cambiarOpacidad) return m.cambiarOpacidad(v * 0.82);
    /* Mapa esquemático: no hay capas, se atenúa el SVG completo. */
    const svg = contenedorMapa.querySelector('svg');
    if (svg) svg.style.opacity = v;
  });
});

/* ---- Ficha de la comuna, sobre el mapa ----
   Solo existe con una comuna elegida: vacía, como tarjeta fija, ocupaba una
   columna entera para decir "haz clic en una comuna", cosa que ahora dice el
   propio mapa. */
const ficha = document.getElementById('ficha');

function ocultarFicha() {
  ficha.hidden = true;
  contenedorMapa.classList.remove('map--ficha');
  if (typeof GTModelo3D !== 'undefined') GTModelo3D.cerrar();
}

/* Las dos erosiones de la comuna, lado a lado (UC-06). Antes la ficha daba
   una sola, "Erosión estimada", que era la del origen elegido —CIREN por
   omisión— aunque el mapa estuviera mostrando el cálculo propio. */
function filasErosion(c) {
  const e = GTMapa.erosionesDe(c, GT.comunas.indexOf(c));
  function celda(v, nota) {
    if (typeof v !== 'number') return '<span class="muted">' + (nota || 'sin dato') + '</span>';
    const cl = GT.claseErosion(v);
    return GT.fmt(v, 1) + ' t/ha/año ' +
           '<span class="badge" style="background:' + cl.hex + '2E;border-color:' + cl.hex + '66;color:var(--texto)">' + cl.nombre + '</span>' +
           (nota ? '<br><span class="tiny muted">' + nota + '</span>' : '');
  }
  const propiaVisible = e.enDominio || GT.incluirFueraDeDominio;
  return fila('Erosión CIREN' + (GT.anioCiren ? ' ' + GT.anioCiren : ''), celda(e.ciren)) +
         fila('Erosión TerraFoco' + (GT.anioPropia ? ' ' + GT.anioPropia : ''),
              celda(propiaVisible ? e.propia : undefined,
                    e.enDominio ? null : 'fuera del dominio del modelo'));
}

/* El programa en la ficha: lo ejecutado 2012-2025 y la inversión con que se
   calcula el índice. Decía "Inversión acumulada" y "Beneficiarios" sin
   período, y los beneficiarios suman agricultores de cada año, así que un
   mismo productor con planes en tres años contaba tres veces. */
function filasPrograma(c) {
  const p = GT.periodoInversion;
  const periodo = p ? '<br><span class="tiny">' + p[0] + '–' + p[1] + '</span>' : '';
  let uf = '<span class="muted">sin dato</span>';
  if (typeof c.inversionUFha === 'number') {
    uf = (c.fueraDeDominio && !GT.incluirFueraDeDominio)
      ? '<span class="muted">fuera del dominio del modelo</span>'
      : '<strong class="mono">' + GT.fmt(c.inversionUFha, c.inversionUFha < 1 ? 2 : 1) + '</strong> UF/ha';
  }
  return fila('Planes ejecutados' + periodo, GT.fmt(c.planes || 0)) +
         fila('Superficie intervenida', GT.fmt(c.haBonif) + ' ha') +
         fila('Incentivo pagado',
              (typeof c.incentivoUF === 'number' ? GT.fmt(c.incentivoUF / 1000, 1) + ' mil UF · ' : '') +
              '$' + GT.fmt(c.monto) + ' MM') +
         (typeof c.inversionUFha === 'number'
           ? fila('Incentivo por ha<br><span class="tiny">con erosión severa</span>', uf) : '');
}

function filaIndice(c) {
  const segun = GT.origenErosion ? '<br><span class="tiny">según ' +
    (GT.origenErosion === 'CIREN' ? 'el inventario CIREN' : 'el cálculo propio') + '</span>' : '';
  if (!GT.enIndice(c)) {
    return fila('Índice de pertinencia' + segun,
                '<span class="muted">' + GT.motivoSinIndice(c) + '</span>');
  }
  const cat = GT.categoriaPertinencia(c.indice);
  return fila('Índice de pertinencia' + segun, '<strong class="mono">' + GT.fmt(c.indice, 2) + '</strong>') +
         '<div class="badge" style="background:' + cat.hex + '22;color:' + cat.hex + ';align-self:flex-start">' + cat.nombre +
           (c.fueraDeDominio ? ' · fuera de dominio' : '') + '</div>';
}

function mostrarFicha(c) {
  ficha.hidden = false;
  contenedorMapa.classList.add('map--ficha');
  ficha.innerHTML =
    '<div class="map__ficha-cab">' +
      '<div class="card__title">Comuna seleccionada</div>' +
      '<button type="button" class="map__ficha-cerrar" aria-label="Cerrar y volver a la región" ' +
        'title="Cerrar y volver a la región">×</button>' +
    '</div>' +
    '<div style="font-size:18px;font-weight:600;line-height:1.2">' + c.nombre + '</div>' +
    '<div class="tiny muted">Provincia de ' + c.prov + ' · ' + GT.fmt(c.sup) + ' km²</div>' +
    '<div class="sep"></div>' +
    filasErosion(c) +
    '<div class="sep"></div>' +
    filasPrograma(c) +
    '<div class="sep"></div>' +
    /* Con cuál de las dos erosiones se calcula el índice: la del selector
       de origen de la barra superior. */
    filaIndice(c) +
    /* La comuna como maqueta 3D: con la capa de pendiente es el botón
       principal, porque es lo que se está mirando. */
    '<button type="button" class="btn ' + (capaActual() === 'pendiente' ? 'btn--primary' : '') +
      '" id="btnModelo3D" style="justify-content:center;margin-top:4px">Ver la comuna en 3D</button>' +
    '<a href="comuna.html?id=' + c.id + '" class="btn ' + (capaActual() === 'pendiente' ? '' : 'btn--primary') +
      '" style="justify-content:center;text-decoration:none">Abrir ficha completa</a>';
  ficha.querySelector('.map__ficha-cerrar').addEventListener('click', function () {
    conMapa(function (m) { if (m.volverARegion) m.volverARegion(); else ocultarFicha(); });
  });
  ficha.querySelector('#btnModelo3D').addEventListener('click', function () { abrirModelo3D(c); });
  // Con la capa de pendiente, el modelo se abre al elegir la comuna.
  if (capaActual() === 'pendiente') abrirModelo3D(c);
}

function capaActual() {
  const r = document.querySelector('input[name="capa"]:checked');
  return r ? r.value : null;
}

/* El modelo 3D de la comuna sobre el mapa: la geometría sale de la misma
   fuente que dibuja el mapa. */
function abrirModelo3D(c) {
  conMapa(function (m) {
    const fuente = m.instancia && m.instancia.getSource('comunas');
    if (!fuente || typeof GTModelo3D === 'undefined') return;
    Promise.resolve(fuente.getData()).then(function (geo) {
      const f = (geo.features || []).filter(function (x) { return x.properties.nombre === c.nombre; })[0];
      if (!f) return;
      GTModelo3D.abrir({ contenedor: contenedorMapa, nombre: c.nombre, geometria: f.geometry });
    });
  });
}

function fila(k, v) {
  return '<div class="row" style="justify-content:space-between;gap:12px">' +
           '<span class="small muted">' + k + '</span>' +
           '<span class="small" style="text-align:right">' + v + '</span>' +
         '</div>';
}

});
</script>
</body>
</html>
